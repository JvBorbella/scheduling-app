name: scheduling
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2928.1
  image_picker: ^1.2.2
  flutter_expanded_tile: ^0.4.0
  searchfield: ^2.0.0
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  brasil_fields: ^1.19.0
  omni_datetime_picker: ^2.3.2
  flutter_circle_color_picker: ^0.3.0
  http_parser: ^4.1.2
  all_validations_br: ^4.3.0
  uuid: ^4.5.3
  webview_flutter: ^4.14.1
  infinite_calendar_view: ^2.12.0
  calendar_view: ^2.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/WhatsApp.png
    - assets/icons/pdf.png
    - assets/icons/excel.png
    - .env
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  rxdart: ^0.28.0
  intl: ^0.20.2
